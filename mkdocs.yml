site_name: pipguard
site_description: Python supply chain security tool. Scan packages before installing them.
site_url: https://shenxianpeng.dev/pipguard/
repo_url: https://github.com/shenxianpeng/pipguard
repo_name: shenxianpeng/pipguard
edit_uri: edit/main/docs/

theme:
  name: sumi
  accent: indigo
  favicon: assets/favicon.png
  logo: assets/logo.svg

nav:
  - Home: index.md
  - Get Started:
    - Installation: installation.md
    - Usage: usage.md
  - How It Works: how-it-works.md
  - vs Other Tools: comparison.md
  - Reference:
    - Risk Levels: risk-levels.md
    - Exit Codes: exit-codes.md
    - Seed Allowlist: allowlist.md
    - Policy as Code: policy.md
    - Runtime Sandbox: runtime-sandbox.md
    - Toolchain Trust: toolchain.md

plugins:
  - search
  - sumi

languages:
  en: English
  zh:
    name: 简体中文
    nav:
      - 首页: index.md
      - 快速开始:
        - 安装指南: installation.md
        - 使用说明: usage.md
      - 工作原理: how-it-works.md
      - 对比其他工具: comparison.md
      - 参考:
        - 风险等级: risk-levels.md
        - 退出码: exit-codes.md
        - 种子允许列表: allowlist.md
        - 策略即代码: policy.md
        - 运行时沙箱: runtime-sandbox.md
        - 工具链信任: toolchain.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: brand-github
      link: https://github.com/shenxianpeng/pipguard
    - icon: brand-python
      link: https://pypi.org/project/pipguard/
  generator: false

copyright: MIT License · pipguard
