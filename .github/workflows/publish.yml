# pipguard — Publish pipguard to PyPI
#
# Triggers on push of a version tag (e.g. v0.2.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token needed.
#
# One-time setup required on PyPI before first run:
#   pypi.org → Manage account → Publishing → Add a new publisher
#   Publisher: GitHub  |  Owner: shenxianpeng  |  Repo: pipguard
#   Workflow: publish.yml  |  Environment: pypi

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # setuptools-scm needs full history for version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Upgrade pip past the compromised emSign CA (hash-pinned)
        # pip < 26.2.2 trusts a compromised CA; don't fetch build deps through it.
        run: python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pipguard/
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 @ 2025-03-25
        with:
          # Emit PEP 740 build provenance / attestations (signed via OIDC).
          # Default-on for trusted publishing; set explicitly as a trust signal.
          attestations: true
