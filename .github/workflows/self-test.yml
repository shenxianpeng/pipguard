name: Self Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Upgrade pip past the compromised emSign CA (hash-pinned)
        run: python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install pipguard from source
        run: pip install -e .

      - name: Detection benchmark (TPR/FPR report)
        run: python benchmark/run_benchmark.py

      - name: Clean package is allowed (requests)
        run: pipguard install requests --yes

      - name: Verify requests is importable
        run: python -c "import requests"

      - name: Malicious package is blocked (simulated .pth attack)
        run: |
          # tests/fixtures/wheels/malicious_pth-1.0.0-py3-none-any.whl is a
          # pre-built test wheel containing a .pth file with executable Python
          # code — the same supply chain attack technique used in the real
          # litellm 1.82.8 incident.  The original litellm==1.82.8 was removed
          # from PyPI, so we use a local fixture to keep the test self-contained.
          set +e
          pipguard install tests/fixtures/wheels/malicious_pth-1.0.0-py3-none-any.whl
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 1 ]; then
            echo "✅ PASS: malicious-pth correctly blocked (exit 1)"
          else
            echo "❌ FAIL: expected exit 1, got $exit_code"
            exit 1
          fi

  action-test:
    # Exercises the composite Action (action.yml) end-to-end so its wiring is
    # covered by CI. Installs pipguard from source into the runner first, then
    # points the action at that build via version="" (latest) is avoided by
    # using packages input against the already-installed CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan a clean package via the pipguard action
        uses: ./
        with:
          packages: 'requests'

      - name: Verify requests is importable
        run: python -c "import requests"

      - name: Toolchain is trusted after the action (pip >= 26.2.2)
        run: |
          python -m pip --version
          python -c 'from importlib.metadata import version; v = tuple(int(p) for p in version("pip").split(".")[:3]); assert v >= (26, 2, 2), v'

  toolchain-gate:
    # Proves the gate end-to-end: an install through a pip that still trusts
    # the compromised emSign root is refused (exit 2), and passes once pip is
    # upgraded from the hash-pinned wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Show runner trust state
        run: |
          python -m pip --version
          pip install -e .
          pipguard doctor || true

      - name: Vulnerable pip is refused
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          set +e
          pipguard install six --yes
          rc=$?
          set -e
          echo "exit code: $rc"
          test "$rc" -eq 2

      - name: Fixed pip is allowed (system store filtered for the run)
        run: |
          python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          pipguard doctor || true
          set -o pipefail
          pipguard install six --yes 2>&1 | tee out.txt
          python -c "import six"
          # The runner's store still has the root, so the run must have filtered it.
          if pipguard doctor >/dev/null; then echo "runner store already clean"; else grep -q "removed it for this run" out.txt; fi
